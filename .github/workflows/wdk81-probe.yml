name: Windows 8.1 WDK availability
on:
  workflow_dispatch:
jobs:
  bqhr:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install SDK and WDK 8.1
        shell: pwsh
        run: ./tools/ci/install-wdk81.ps1
      - name: Build and test-sign BQHR-only delta
        shell: pwsh
        run: ./tools/ci/build-usb-bqhr-signed.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bqhr-readonly-test-signed
          path: ${{ runner.temp }}\usb-bqhr-signed
          if-no-files-found: error
