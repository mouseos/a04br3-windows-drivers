name: Windows 8.1 WDK availability
on:
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: Keep the Windows runner available over SSH
        type: boolean
        default: false
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Open SSH before SDK and WDK setup
        if: ${{ inputs.ssh_debug }}
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
          on-ready-script: tools/ci/install-wdk81.ps1
      - name: Inspect installed Windows SDK and ARM compilers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -ErrorAction SilentlyContinue | Select-Object Name
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -all -products '*' -property installationPath }
          Get-Command clang.exe,lld-link.exe -ErrorAction SilentlyContinue | Select-Object Name,Source
      - name: Download and verify official Windows 8.1 installers
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'sdk81-setup.exe'
          $wdk = Join-Path $env:RUNNER_TEMP 'wdk81-setup.exe'
          & curl.exe --fail --location --retry 3 --output $sdk 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installer download failed' }
          & curl.exe --fail --location --retry 3 --output $wdk 'https://download.microsoft.com/download/8/6/9/86925F0F-D57A-4BA4-8278-861B6876D78E/wdk/wdksetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'WDK installer download failed' }
          foreach ($file in @($sdk, $wdk)) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$(Split-Path $file -Leaf): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Installer signature verification failed' }
          }
      - name: Install official SDK and WDK
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('sdk81-setup.exe', 'wdk81-setup.exe')) {
            $process = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP $name) -ArgumentList '/quiet','/norestart' -Wait -PassThru
            Write-Host "$name exit code $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw "$name installation failed or requires reboot" }
          }
      - name: Inspect ARM32 WDK headers and import libraries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          foreach ($path in @('Include\km\ntddk.h','Include\km\storport.h','Lib\winv6.3\km\arm\ntoskrnl.lib','Lib\winv6.3\km\arm\storport.lib')) {
            $full = Join-Path $kit $path
            Write-Host "$path : $(Test-Path $full)"
            if (-not (Test-Path $full)) { throw "Missing required ARM32 WDK component: $path" }
          }
      - name: Build gated ARM32 audio and shared parent checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_AUDIO_CHILD_RESOURCES='1'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_SHARED_MT6392_DIAGNOSTIC='1'
          $env:A04_SHARED_MT8167_CODEC_DOMAIN_DIAGNOSTIC='1'
          $env:A04_SHARED_VOICE_PCM_DIAGNOSTIC='1'
          $env:A04_SHARED_VOICE_DIAGNOSTIC='1'
          $env:A04_MT6392_UNMUTE_DIAGNOSTIC='1'
          $env:A04_MT6392_RTC32K_DIAGNOSTIC='1'
          $env:A04_SHARED_WIFI_IRQ_DIAGNOSTIC='1'
          $env:A04_USB_POWER_OBSERVATION='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          $env:A04_SHARED_AUDIO_TOP_GATE_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_AFE_CLOCK_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_IRQ_PREP_DIAGNOSTIC='1'
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt8167-audio-portcls.ps1
      - name: Build gated USB host and read-only power observation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_USB_POWER_OBSERVATION='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt8167-usb20.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'a04-usb20-link')
      - name: Test-sign parent link probe and record provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'usb-power-observation'
          New-Item -ItemType Directory -Force $output | Out-Null
          $driver = Join-Path $output 'mt8167-shared.sys'
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\mt8167-shared.sys') $driver
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 USB Power Observation Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          & (Join-Path "${env:ProgramFiles(x86)}\Windows Kits\8.1" 'bin\x86\signtool.exe') sign /fd SHA256 /sha1 $cert.Thumbprint /s My $driver
          if ($LASTEXITCODE -ne 0) { throw 'Test signing failed' }
          $signature = Get-AuthenticodeSignature $driver
          if (!$signature.SignerCertificate -or $signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Unexpected signature' }
          Export-Certificate -Cert $cert -FilePath (Join-Path $output 'usb-observation-test.cer') | Out-Null
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash; signer_thumbprint = $cert.Thumbprint; signature_status = "$($signature.Status)"; flags = 'shared query, children, button D0, APMIXED, GPIO read-only observation, trace'; note = 'Self-signed link probe without INF/catalog. RT trust, PnP and hardware operation not established.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: usb-power-observation-test-signed
          path: ${{ runner.temp }}\usb-power-observation
          if-no-files-found: error
      - name: Build touch parent with GPIO observation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_TOUCH_D0_EXPERIMENT='1'
          $env:A04_USB_POWER_OBSERVATION='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          $env:A04_SHARED_APMIXED_RESOURCE='0'
          $env:A04_USB_GPIO22_SOURCE_EXPERIMENT='0'
          ./tools/ci/build-msdc-parent-probe.ps1
      - name: Package test-signed touch parent with GPIO observation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $output = Join-Path $env:RUNNER_TEMP 'usb-touch-observation-parent'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\mt8167-shared.sys') $output
          Copy-Item 'drivers/bus/mt8167-shared/prototype/shared-parent.inf' $output
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 USB Touch Observation Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $output 'usb-touch-observation-test.cer') | Out-Null
          $sign = Join-Path $kit 'bin\x86\signtool.exe'
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $output 'mt8167-shared.sys')
          if ($LASTEXITCODE -ne 0) { throw 'SYS test signing failed' }
          & (Join-Path $kit 'bin\x86\Inf2Cat.exe') "/driver:$output" /os:6_3_ARM /uselocaltime
          if ($LASTEXITCODE -ne 0) { throw 'Catalog creation failed' }
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $output 'shared-parent.cat')
          if ($LASTEXITCODE -ne 0) { throw 'Catalog test signing failed' }
          $sig = Get-AuthenticodeSignature (Join-Path $output 'mt8167-shared.sys')
          if (!$sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Unexpected signer' }
          [ordered]@{ source_commit=(git rev-parse HEAD); shared_query=1; shared_children=1; button_d0=1; touch_d0=1; usb_power_observation=1; trace=1; apmixed=0; gpio22_source=0; other_optional_flags=0; signer_sha1=$cert.Thumbprint; signature_status="$($sig.Status)"; files=@{ 'mt8167-shared.sys'=(Get-FileHash (Join-Path $output 'mt8167-shared.sys') -Algorithm SHA256).Hash; 'shared-parent.inf'=(Get-FileHash (Join-Path $output 'shared-parent.inf') -Algorithm SHA256).Hash; 'shared-parent.cat'=(Get-FileHash (Join-Path $output 'shared-parent.cat') -Algorithm SHA256).Hash }; note='Self-signed parent diagnostic candidate. GPIO latch is not VBUS voltage; debug output requires a configured collector. Target trust, PnP, touch and GPU are unverified for this build.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: usb-touch-observation-parent-test-signed
          path: ${{ runner.temp }}\usb-touch-observation-parent
          if-no-files-found: error
      - name: Build GPIO UART and touch integration package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_TOUCH_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_AUDIO_CHILD_RESOURCES='1'
          $env:A04_SHARED_AUDIO_TOP_GATE_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_AFE_CLOCK_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_IRQ_PREP_DIAGNOSTIC='1'
          $env:A04_SHARED_MT6392_DIAGNOSTIC='1'
          $env:A04_SHARED_MT8167_CODEC_DOMAIN_DIAGNOSTIC='1'
          $env:A04_MT6392_CLK_ALIAS_EXPERIMENT='0'
          $env:A04_MT6392_UNMUTE_DIAGNOSTIC='0'
          $env:A04_USB_POWER_OBSERVATION='1'
          $env:A04_USB_POWER_IOCTL='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          $env:A04_USB_GPIO22_SOURCE_EXPERIMENT='0'
          $env:A04_TOUCH_SHARED_PARENT='1'
          $env:A04_TOUCH_TRACE='1'
          $env:A04_TOUCH_THERMAL_LEASE='0'
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-wdf-touch.ps1
          ./tools/ci/build-usb-power-uart.ps1
      - name: Test-sign GPIO UART and touch integration package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit="${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $out=Join-Path $env:RUNNER_TEMP 'usb-power-touch-integration'
          New-Item -ItemType Directory -Force (Join-Path $out 'parent'),(Join-Path $out 'touch'),(Join-Path $out 'tools') | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\mt8167-shared.sys') (Join-Path $out 'parent')
          Copy-Item 'drivers/bus/mt8167-shared/prototype/shared-parent.inf' (Join-Path $out 'parent')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-wdf-touch\bu21025.sys') (Join-Path $out 'touch')
          Copy-Item 'drivers/bus/mt8167-shared/prototype/shared-touch.inf' (Join-Path $out 'touch')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-usb-power-uart\usb-power-uart.exe') (Join-Path $out 'tools')
          Copy-Item 'tools/winpe/usb-power-observe.cmd' (Join-Path $out 'tools')
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 USB Power Touch Integration Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $out 'integration-test.cer') | Out-Null
          $sign=Join-Path $kit 'bin\x86\signtool.exe'
          foreach($p in @(@('parent','mt8167-shared.sys','shared-parent.cat'),@('touch','bu21025.sys','bu21025.cat'))) {
            $dir=Join-Path $out $p[0];$sys=Join-Path $dir $p[1];$cat=Join-Path $dir $p[2]
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My $sys
            if($LASTEXITCODE -ne 0){throw 'SYS signing failed'}
            & (Join-Path $kit 'bin\x86\Inf2Cat.exe') "/driver:$dir" /os:6_3_ARM /uselocaltime
            if($LASTEXITCODE -ne 0){throw 'Catalog creation failed'}
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My $cat
            if($LASTEXITCODE -ne 0){throw 'Catalog signing failed'}
            $sig=Get-AuthenticodeSignature $sys
            if(!$sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint){throw 'SYS signer mismatch'}
          }
          $exe=Join-Path $out 'tools\usb-power-uart.exe'
          & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My $exe
          if($LASTEXITCODE -ne 0){throw 'Utility signing failed'}
          $exeSig=Get-AuthenticodeSignature $exe
          if(!$exeSig.SignerCertificate -or $exeSig.SignerCertificate.Thumbprint -ne $cert.Thumbprint){throw 'Utility signer mismatch'}
          $hashes=@{}; Get-ChildItem $out -Recurse -File | ForEach-Object { $name=$_.FullName.Substring($out.Length+1).Replace('\','/');$hashes[$name]=(Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          [ordered]@{source_commit=(git rev-parse HEAD); parent_flags=@{query=1;children=1;button_d0=1;touch_d0=1;apmixed=1;audio_child=1;audio_top=1;audio_afe=1;audio_irq=1;mt6392=1;codec_domain=1;clock_alias=0;unmute=0;observation=1;ioctl=1;audio_trace=1;gpio22_source=0;other_optional=0};touch_flags=@{shared_parent=1;trace=1;thermal_lease=0};signer_sha1=$cert.Thumbprint;files=$hashes;note='Self-signed candidate, not a complete WinPE image. Compare firmware resources and every parent/touch flag with the known-working GPU candidate. UART delivery and target trust/PnP are unverified.'} | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $out 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: usb-power-touch-integration-test-signed
          path: ${{ runner.temp }}\usb-power-touch-integration
          if-no-files-found: error
      - name: Build MT8167 parent and MT6630 query probes
        shell: pwsh
        run: |
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt6630-parent-probe.ps1
          ./tools/ci/build-mt6630-wdf-lease-probe.ps1
      - name: Upload MT6630 WDF lease probes
        uses: actions/upload-artifact@v4
        with:
          name: a04-mt6630-wdf-lease-probes
          path: ${{ runner.temp }}\a04br3-wifi-wdf-lease-probe\*.sys
          if-no-files-found: error
      - name: Build MT6630 ARM32 integration link check
        shell: pwsh
        run: |
          ./tools/ci/build-mt6630-integrated-link.ps1
          $driver = Join-Path $env:TEMP 'a04br3-mt6630-core\mt6630-integrated-link-check.sys'
          $output = Join-Path $env:RUNNER_TEMP 'a04-mt6630-link-check'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $driver $output
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash; note = 'Unsigned link check only; initialization fails, no INF, not installable.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - name: Build gated MT6630 session and IRQ ARM32 link check
        shell: pwsh
        run: |
          $env:A04_WIFI_SESSION_DIAGNOSTIC='1'
          $env:A04_WIFI_IRQ_DIAGNOSTIC='1'
          ./tools/ci/build-mt6630-integrated-link.ps1
      - name: Test-sign MT6630 link-only image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'a04-mt6630-link-check'
          $signed = Join-Path $output 'mt6630-link-only-test-signed.sys'
          Copy-Item (Join-Path $output 'mt6630-integrated-link-check.sys') $signed
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 MT6630 CI Test Only' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          & (Join-Path $kit 'bin\x86\signtool.exe') sign /fd SHA256 /sha1 $cert.Thumbprint /s My $signed
          if ($LASTEXITCODE -ne 0) { throw 'MT6630 test signature failed' }
          $sig = Get-AuthenticodeSignature $signed
          if (!$sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Wrong embedded signing certificate' }
          Export-Certificate -Cert $cert -FilePath (Join-Path $output 'mt6630-ci-test.cer') | Out-Null
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $signed -Algorithm SHA256).Hash; signer_thumbprint = $cert.Thumbprint; signature_status = "$($sig.Status)"; note = 'Self-signed compile/link diagnostic only. Not installable, not proof of RT trust or PnP.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'test-signed-manifest.json')
      - name: Upload MT6630 integration link check
        uses: actions/upload-artifact@v4
        with:
          name: a04-mt6630-link-check
          path: ${{ runner.temp }}\a04-mt6630-link-check
          if-no-files-found: error
      - name: Compile non-operational Storport interface probe
        shell: pwsh
        run: ./tools/ci/build-wdk81-probe.ps1
      - name: Compile isolated boot storage with and without multiblock reads
        shell: pwsh
        run: |
          $env:A04_BOOT_EXPERIMENT='1'
          $env:A04_BOOT_PASSIVE_EXPERIMENT='1'
          $env:A04_PASSIVE_IO='1'
          $env:A04_ENABLE_WRITES='1'
          $env:A04_READONLY_DISK_PROBE='1'
          $env:A04_DMA_PROBE='1'
          $env:A04_DMA_DISK_PROBE='1'
          $env:A04_VIRTUAL_BOUNCE_EXPERIMENT='1'
          $env:A04_SERIAL_QUEUE_EXPERIMENT='1'
          $env:A04_ISOLATED_REQUEST_EXPERIMENT='1'
          $env:A04_BOOT_MULTIBLOCK_EXPERIMENT='0'
          ./tools/ci/build-wdk81-probe.ps1
          $env:A04_BOOT_MULTIBLOCK_EXPERIMENT='1'
          ./tools/ci/build-wdk81-probe.ps1
      - name: Compile non-operational ARM32 touch link probe
        shell: pwsh
        run: ./tools/ci/build-touch-link-probe.ps1
      - name: Compile non-operational ARM32 KMDF probe
        shell: pwsh
        run: ./tools/ci/build-kmdf-touch-probe.ps1
      - name: Compile experimental button interface probe
        shell: pwsh
        run: ./tools/ci/build-button-kernel-probe.ps1
      - name: Compile experimental KMDF button provider
        shell: pwsh
        run: ./tools/ci/build-button-provider.ps1
      - name: Compile LC709203F battery components
        shell: pwsh
        run: ./tools/ci/build-lc709203f-probe.ps1
      - name: Compile button provider PnP status tool
        shell: pwsh
        run: ./tools/ci/build-button-provider-status.ps1
      - name: Compile GE8300 firmware provider and status tool
        shell: pwsh
        run: |
          ./tools/ci/build-ge8300-provider.ps1
          ./tools/ci/build-ge8300-status.ps1
      - name: Compile non-installable ARM32 display-only build check
        shell: pwsh
        run: ./tools/ci/build-wddm-display-arm.ps1
      - name: Compile WinPE file comparison tool
        shell: pwsh
        run: ./tools/ci/build-compare-files.ps1 -Arch arm
      - name: Sign and stage experimental button probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $driver = Join-Path $env:RUNNER_TEMP 'a04-button-kernel-probe\button-interface-probe.sys'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 Button Kernel Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          & (Join-Path $kit 'bin\x86\signtool.exe') sign /fd SHA256 /sha1 $cert.Thumbprint /s My $driver
          if ($LASTEXITCODE -ne 0) { throw 'Kernel probe test signing failed' }
          $output = Join-Path $env:RUNNER_TEMP 'a04-button-artifact'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $driver $output
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash; note = 'Experimental test-signed diagnostic; not a production driver.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - name: Upload experimental button probe
        uses: actions/upload-artifact@v4
        with:
          name: a04-button-kernel-probe
          path: ${{ runner.temp }}\a04-button-artifact
          if-no-files-found: error
      - name: Test guarded cleanup with a missing driver file
        shell: pwsh
        run: |
          ./tools/ci/build-compare-files.ps1 -Arch x64
          ./tools/ci/test-button-kernel-missing.ps1
      - name: Test button provider staging guards
        shell: pwsh
        run: ./tools/ci/test-button-provider-stage.ps1
      - name: Test button provider removal guards
        shell: pwsh
        run: ./tools/ci/test-button-provider-remove.ps1
      - name: Open restricted SSH for intervention
        id: remote
        if: ${{ always() && inputs.ssh_debug }}
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
