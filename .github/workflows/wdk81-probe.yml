name: Windows 8.1 WDK availability
on:
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: Keep the Windows runner available over SSH
        type: boolean
        default: false
      dev_ssh_only:
        description: Open one reusable development runner without unrelated build checks
        type: boolean
        default: false
      ssh_keep_minutes:
        description: Development SSH lifetime, at most 330 minutes
        type: number
        default: 330
jobs:
  probe:
    if: ${{ !(inputs.ssh_debug && inputs.dev_ssh_only) }}
    runs-on: windows-2022
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - name: Open SSH before SDK and WDK setup
        if: ${{ inputs.ssh_debug }}
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
          on-ready-script: tools/ci/install-wdk81.ps1
      - name: Inspect installed Windows SDK and ARM compilers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -ErrorAction SilentlyContinue | Select-Object Name
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) { & $vswhere -all -products '*' -property installationPath }
          Get-Command clang.exe,lld-link.exe -ErrorAction SilentlyContinue | Select-Object Name,Source
      - name: Download and verify official Windows 8.1 installers
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = Join-Path $env:RUNNER_TEMP 'sdk81-setup.exe'
          $wdk = Join-Path $env:RUNNER_TEMP 'wdk81-setup.exe'
          & curl.exe --fail --location --retry 3 --output $sdk 'https://download.microsoft.com/download/B/0/C/B0C80BA3-8AD6-4958-810B-6882485230B5/standalonesdk/sdksetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installer download failed' }
          & curl.exe --fail --location --retry 3 --output $wdk 'https://download.microsoft.com/download/8/6/9/86925F0F-D57A-4BA4-8278-861B6876D78E/wdk/wdksetup.exe'
          if ($LASTEXITCODE -ne 0) { throw 'WDK installer download failed' }
          foreach ($file in @($sdk, $wdk)) {
            $sig = Get-AuthenticodeSignature $file
            Write-Host "$(Split-Path $file -Leaf): $($sig.Status), $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') { throw 'Installer signature verification failed' }
          }
      - name: Install official SDK and WDK
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('sdk81-setup.exe', 'wdk81-setup.exe')) {
            $process = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP $name) -ArgumentList '/quiet','/norestart' -Wait -PassThru
            Write-Host "$name exit code $($process.ExitCode)"
            if ($process.ExitCode -ne 0) { throw "$name installation failed or requires reboot" }
          }
      - name: Inspect ARM32 WDK headers and import libraries
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          foreach ($path in @('Include\km\ntddk.h','Include\km\storport.h','Lib\winv6.3\km\arm\ntoskrnl.lib','Lib\winv6.3\km\arm\storport.lib')) {
            $full = Join-Path $kit $path
            Write-Host "$path : $(Test-Path $full)"
            if (-not (Test-Path $full)) { throw "Missing required ARM32 WDK component: $path" }
          }
      - name: Build gated ARM32 audio and shared parent checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_AUDIO_CHILD_RESOURCES='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_SHARED_MT6392_DIAGNOSTIC='1'
          $env:A04_SHARED_MT8167_CODEC_DOMAIN_DIAGNOSTIC='1'
          $env:A04_SHARED_VOICE_PCM_DIAGNOSTIC='1'
          $env:A04_SHARED_VOICE_DIAGNOSTIC='1'
          $env:A04_MT6392_UNMUTE_DIAGNOSTIC='1'
          $env:A04_MT6392_RTC32K_DIAGNOSTIC='1'
          $env:A04_SHARED_WIFI_IRQ_DIAGNOSTIC='1'
          $env:A04_USB_GPIO22_SOURCE_EXPERIMENT='1'
          $env:A04_SHARED_AUDIO_TOP_GATE_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_AFE_CLOCK_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_IRQ_PREP_DIAGNOSTIC='1'
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt8167-audio-portcls.ps1
      - name: Stage non-installable audio diagnostics build checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'a04-audio-buildchecks'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $inputs = @(
            (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\mt8167-shared.sys'),
            (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\codec_adc_probe.obj'),
            (Join-Path $env:TEMP 'a04-mt8167-portcls\mt8167-audio-retained-buildcheck.sys')
          )
          foreach ($file in $inputs) { if (!(Test-Path $file)) { throw "Missing build check: $file" }; Copy-Item $file $stage }
          $hashes = @(Get-ChildItem $stage -File | ForEach-Object { @{ name=$_.Name; sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash } })
          @{ source_commit=(git rev-parse HEAD); installable=$false; purpose='unsigned build checks only; ADC object is not linked to the parent'; files=$hashes } | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $stage 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: a04-audio-noninstallable-buildchecks
          path: ${{ runner.temp }}\a04-audio-buildchecks
          if-no-files-found: error
      - name: Build gated USB host and GPIO22 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_USB_GPIO22_SOURCE_EXPERIMENT='1'
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt8167-usb20.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'a04-usb20-link')
      - name: Build combined watchdog and UART diagnostics
        shell: pwsh
        run: |
          $env:A04_TOPRGU_CPU1_HANDOFF='1'
          $env:A04_TOPRGU_UART_SCREEN='1'
          $env:A04_TOPRGU_UART_VOLUME='1'
          $env:A04_TOPRGU_THERMAL_STOP='1'
          ./tools/ci/build-mt8167-toprgu.ps1
      - name: Test-sign combined watchdog and UART diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'mt8167-toprgu'
          $kit="${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=MT8167 TOPRGU UART Thermal Diagnostic' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          try {
            Export-Certificate -Cert $cert -FilePath (Join-Path $dir 'mt8167-toprgu-test.cer') | Out-Null
            $sign=Join-Path $kit 'bin\x86\signtool.exe'
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $dir 'mt8167-toprgu.sys'); if($LASTEXITCODE){throw 'SYS signing failed'}
            Remove-Item (Join-Path $dir 'mt8167-toprgu.cat')
            & (Join-Path $kit 'bin\x86\Inf2Cat.exe') "/driver:$dir" /os:6_3_ARM /uselocaltime; if($LASTEXITCODE){throw 'Catalog generation failed'}
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $dir 'mt8167-toprgu.cat'); if($LASTEXITCODE){throw 'CAT signing failed'}
            $files=@('mt8167-toprgu.sys','mt8167-toprgu.cat','mt8167-toprgu.inf','mt8167-toprgu-test.cer')
            $hashes=@($files | ForEach-Object { @{name=$_;sha256=(Get-FileHash (Join-Path $dir $_) -Algorithm SHA256).Hash} })
            @{source_commit=(git rev-parse HEAD);cpu1_handoff=1;uart_screen=1;uart_volume=1;thermal_stop=1;files=$hashes;note='Test-signed prototype; target operation and trust unverified'} | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $dir 'manifest.json')
          } finally { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: a04-toprgu-uart-thermal-test-signed
          path: |
            ${{ runner.temp }}\mt8167-toprgu\mt8167-toprgu.sys
            ${{ runner.temp }}\mt8167-toprgu\mt8167-toprgu.cat
            ${{ runner.temp }}\mt8167-toprgu\mt8167-toprgu.inf
            ${{ runner.temp }}\mt8167-toprgu\mt8167-toprgu-test.cer
            ${{ runner.temp }}\mt8167-toprgu\manifest.json
          if-no-files-found: error
      - name: Build and sign shared codec ADC diagnostic
        shell: pwsh
        run: |
          $env:A04_THERMAL_SHARED_PARENT='1'
          $env:A04_THERMAL_LEASE_DIAG='1'
          $env:A04_THERMAL_MONITOR_TEST='1'
          $env:A04_THERMAL_ONESHOT_TEST='1'
          $env:A04_THERMAL_CODEC_ADC_DIAGNOSTIC='1'
          ./tools/ci/build-mt8167-thermal.ps1
          ./tools/ci/sign-mt8167-thermal-test.ps1
          $dir=Join-Path $env:RUNNER_TEMP 'a04br3-thermal-shared-test-signed'
          $files=@('mt8167-thermal.sys','mt8167-thermal.cat','mt8167-thermal.inf','mt8167-thermal-test.cer')
          $hashes=@($files | ForEach-Object { @{name=$_;sha256=(Get-FileHash (Join-Path $dir $_) -Algorithm SHA256).Hash} })
          @{source_commit=(git rev-parse HEAD);shared_parent=1;oneshot=1;codec_adc=1;files=$hashes;note='Test-signed prototype; codec route and mute verifier rejects; UART delivery and target trust unverified'} | ConvertTo-Json -Depth 4 | Set-Content -Encoding UTF8 (Join-Path $dir 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: a04-codec-adc-thermal-test-signed
          path: ${{ runner.temp }}\a04br3-thermal-shared-test-signed
          if-no-files-found: error
      - name: Build and sign shared thermal parent and touch
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:A04_SHARED_BUTTON_D0_EXPERIMENT='1'
          $env:A04_SHARED_TOUCH_D0_EXPERIMENT='1'
          $env:A04_SHARED_APMIXED_RESOURCE='1'
          $env:A04_SHARED_THERMAL_DIAGNOSTIC='1'
          $env:A04_AUDIO_DIAGNOSTIC_TRACE='1'
          $env:A04_SHARED_WIFI_IRQ_DIAGNOSTIC='1'
          $env:A04_AUDIO_CHILD_RESOURCES='1'
          $env:A04_SHARED_MT6392_DIAGNOSTIC='1'
          $env:A04_SHARED_MT8167_CODEC_DOMAIN_DIAGNOSTIC='1'
          $env:A04_SHARED_VOICE_PCM_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_TOP_GATE_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_AFE_CLOCK_DIAGNOSTIC='1'
          $env:A04_SHARED_AUDIO_IRQ_PREP_DIAGNOSTIC='1'
          ./tools/ci/build-msdc-parent-probe.ps1
          $env:A04_TOUCH_SHARED_PARENT='1'
          $env:A04_TOUCH_THERMAL_LEASE='1'
          ./tools/ci/build-wdf-touch.ps1
          $stage=Join-Path $env:RUNNER_TEMP 'a04-adc-shared-unsigned'
          New-Item -ItemType Directory -Force (Join-Path $stage 'parent'),(Join-Path $stage 'touch') | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-msdc-parent-probe\mt8167-shared.sys') (Join-Path $stage 'parent')
          Copy-Item 'drivers/bus/mt8167-shared/prototype/shared-parent.inf' (Join-Path $stage 'parent')
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04-wdf-touch\bu21025.sys') (Join-Path $stage 'touch')
          Copy-Item 'drivers/bus/mt8167-shared/prototype/shared-touch.inf' (Join-Path $stage 'touch')
          $zip=Join-Path $env:RUNNER_TEMP 'a04-adc-shared-unsigned.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip
          $signed=Join-Path $env:RUNNER_TEMP 'a04-adc-shared-signed'
          ./tools/ci/sign-shared-touch.ps1 -InputZip $zip -OutputDirectory $signed
          @{source_commit=(git rev-parse HEAD);thermal_parent=1;touch_lease=1;note='Test-signed diagnostic; target operation and trust unverified'} | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $signed 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: a04-adc-shared-parent-touch-test-signed
          path: ${{ runner.temp }}\a04-adc-shared-signed
          if-no-files-found: error
      - name: Build MT8167 parent and MT6630 query probes
        shell: pwsh
        run: |
          ./tools/ci/build-msdc-parent-probe.ps1
          ./tools/ci/build-mt6630-parent-probe.ps1
          ./tools/ci/build-mt6630-wdf-lease-probe.ps1
      - name: Upload MT6630 WDF lease probes
        uses: actions/upload-artifact@v4
        with:
          name: a04-mt6630-wdf-lease-probes
          path: ${{ runner.temp }}\a04br3-wifi-wdf-lease-probe\*.sys
          if-no-files-found: error
      - name: Build MT6630 ARM32 integration link check
        shell: pwsh
        run: |
          ./tools/ci/build-mt6630-integrated-link.ps1
          $driver = Join-Path $env:TEMP 'a04br3-mt6630-core\mt6630-integrated-link-check.sys'
          $output = Join-Path $env:RUNNER_TEMP 'a04-mt6630-link-check'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $driver $output
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash; note = 'Unsigned link check only; initialization fails, no INF, not installable.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - name: Build gated MT6630 session and IRQ ARM32 link check
        shell: pwsh
        run: |
          $env:A04_WIFI_SESSION_DIAGNOSTIC='1'
          $env:A04_WIFI_IRQ_DIAGNOSTIC='1'
          ./tools/ci/build-mt6630-integrated-link.ps1
      - name: Test-sign MT6630 link-only image
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'a04-mt6630-link-check'
          $signed = Join-Path $output 'mt6630-link-only-test-signed.sys'
          Copy-Item (Join-Path $output 'mt6630-integrated-link-check.sys') $signed
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 MT6630 CI Test Only' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          & (Join-Path $kit 'bin\x86\signtool.exe') sign /fd SHA256 /sha1 $cert.Thumbprint /s My $signed
          if ($LASTEXITCODE -ne 0) { throw 'MT6630 test signature failed' }
          $sig = Get-AuthenticodeSignature $signed
          if (!$sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw 'Wrong embedded signing certificate' }
          Export-Certificate -Cert $cert -FilePath (Join-Path $output 'mt6630-ci-test.cer') | Out-Null
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $signed -Algorithm SHA256).Hash; signer_thumbprint = $cert.Thumbprint; signature_status = "$($sig.Status)"; note = 'Self-signed compile/link diagnostic only. Not installable, not proof of RT trust or PnP.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'test-signed-manifest.json')
      - name: Upload MT6630 integration link check
        uses: actions/upload-artifact@v4
        with:
          name: a04-mt6630-link-check
          path: ${{ runner.temp }}\a04-mt6630-link-check
          if-no-files-found: error
      - name: Compile non-operational Storport interface probe
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-wdk81-probe.ps1
      - name: Compile isolated boot storage with and without multiblock reads
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $env:A04_BOOT_EXPERIMENT='1'
          $env:A04_BOOT_PASSIVE_EXPERIMENT='1'
          $env:A04_PASSIVE_IO='1'
          $env:A04_ENABLE_WRITES='1'
          $env:A04_READONLY_DISK_PROBE='1'
          $env:A04_DMA_PROBE='1'
          $env:A04_DMA_DISK_PROBE='1'
          $env:A04_VIRTUAL_BOUNCE_EXPERIMENT='1'
          $env:A04_SERIAL_QUEUE_EXPERIMENT='1'
          $env:A04_ISOLATED_REQUEST_EXPERIMENT='1'
          $env:A04_BOOT_MULTIBLOCK_EXPERIMENT='0'
          ./tools/ci/build-wdk81-probe.ps1
          $env:A04_BOOT_MULTIBLOCK_EXPERIMENT='1'
          ./tools/ci/build-wdk81-probe.ps1
      - name: Compile non-operational ARM32 touch link probe
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-touch-link-probe.ps1
      - name: Compile non-operational ARM32 KMDF probe
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-kmdf-touch-probe.ps1
      - name: Compile experimental button interface probe
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-button-kernel-probe.ps1
      - name: Compile experimental KMDF button provider
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-button-provider.ps1
      - name: Compile LC709203F battery components
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-lc709203f-probe.ps1
      - name: Compile button provider PnP status tool
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-button-provider-status.ps1
      - name: Compile GE8300 firmware provider and status tool
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          ./tools/ci/build-ge8300-provider.ps1
          ./tools/ci/build-ge8300-status.ps1
      - name: Compile default and ownership-gated GCE provider
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_GCE_PARENT_CLOCK_INTERFACE='0'
          $env:A04_GCE_DISPLAY_LEASE_INTERFACE='0'
          $env:A04_GCE_IRQ_ATTACH='0'
          $env:A04_GCE_HANDOFF_OBSERVE='0'
          ./tools/ci/build-mt8167-gce.ps1
          $env:A04_GCE_HANDOFF_OBSERVE='1'
          ./tools/ci/build-mt8167-gce.ps1
          $env:A04_GCE_PARENT_CLOCK_INTERFACE='1'
          $env:A04_GCE_DISPLAY_LEASE_INTERFACE='1'
          $env:A04_GCE_IRQ_ATTACH='1'
          ./tools/ci/build-mt8167-gce.ps1
      - name: Compile non-installable ARM32 display-only build check
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-wddm-display-arm.ps1
      - name: Compile display GCE observation diagnostic
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:A04_GE8300_WDDM_DIRECT_EXPERIMENT='1'
          $env:A04_GE8300_WDDM_SHARED_LEASE='1'
          $env:A04_GE8300_WDDM_SHARED_DIAGNOSTIC='1'
          $env:A04_GE8300_WDDM_SHARED_AUTOSTART='1'
          $env:A04_GE8300_WDDM_SHARED_COMMON_PAGE='1'
          $env:A04_GE8300_WDDM_SHARED_FULL_COMMON='1'
          $env:A04_GE8300_SHARED_DISPLAY_COMMON='1'
          $env:A04_GE8300_WDDM_COMMON_FRAME_DIAGNOSTIC='1'
          $env:A04_GE8300_WDDM_GCE_LEASE='0'
          $env:A04_GE8300_WDDM_GPU_POST_DIAGNOSTIC='1'
          ./tools/ci/build-wddm-display-arm.ps1
      - name: Build and test-sign observation packages
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $env:A04_GCE_PARENT_CLOCK_INTERFACE='1'
          $env:A04_GCE_DISPLAY_LEASE_INTERFACE='1'
          $env:A04_GCE_IRQ_ATTACH='0'
          $env:A04_GCE_HANDOFF_OBSERVE='1'
          ./tools/ci/build-mt8167-gce.ps1
          $out=Join-Path $env:RUNNER_TEMP 'gce-observation-signed'
          New-Item -ItemType Directory -Force $out | Out-Null
          $gce=Join-Path $out 'gce';$display=Join-Path $out 'display'
          Copy-Item -Recurse (Join-Path $env:RUNNER_TEMP 'mt8167-gce-provider\package') $gce
          New-Item -ItemType Directory -Force $display | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'a04br3-wddm-display-build-check\wddm-display-build-check.sys') (Join-Path $display 'mt8167-display.sys')
          Copy-Item 'drivers/gpu/mt8167/wddm-display/mt8167-display.inf' $display
          $cert=New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 GCE Observation Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          Export-Certificate -Cert $cert -FilePath (Join-Path $out 'gce-observation-test.cer') | Out-Null
          $sign=Join-Path $kit 'bin\x86\signtool.exe';$cat=Join-Path $kit 'bin\x86\Inf2Cat.exe'
          foreach($entry in @(@($gce,'mt8167-gce'),@($display,'mt8167-display'))) {
            $dir=$entry[0];$name=$entry[1]
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $dir "$name.sys")
            if($LASTEXITCODE){throw "SYS signing failed: $name"}
            Remove-Item (Join-Path $dir "$name.cat") -ErrorAction SilentlyContinue
            & $cat "/driver:$dir" /os:6_3_ARM /uselocaltime
            if($LASTEXITCODE){throw "Catalog creation failed: $name"}
            & $sign sign /fd SHA256 /sha1 $cert.Thumbprint /s My (Join-Path $dir "$name.cat")
            if($LASTEXITCODE){throw "Catalog signing failed: $name"}
          }
          $files=Get-ChildItem $out -File -Recurse | ForEach-Object { [ordered]@{path=$_.FullName.Substring($out.Length+1).Replace('\','/');sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash} }
          [ordered]@{source_commit=(git rev-parse HEAD);certificate_thumbprint=$cert.Thumbprint;gce_irq_attach=0;gce_handoff_observe=1;display_gce_lease=0;gpu_post_diagnostic=1;ovl_switch=0;files=@($files);note='GPU copy then CPU POST transfer; direct scanout, execution and secure ownership unverified.'} | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $out 'manifest.json')
      - uses: actions/upload-artifact@v4
        with:
          name: gce-observation-test-signed
          path: ${{ runner.temp }}\gce-observation-signed
          if-no-files-found: error
      - name: Compile WinPE file comparison tool
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/build-compare-files.ps1 -Arch arm
      - name: Sign and stage experimental button probe
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kit = "${env:ProgramFiles(x86)}\Windows Kits\8.1"
          $driver = Join-Path $env:RUNNER_TEMP 'a04-button-kernel-probe\button-interface-probe.sys'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=A04BR3 Button Kernel Test' -CertStoreLocation 'Cert:\CurrentUser\My' -NotBefore (Get-Date).AddYears(-12) -NotAfter (Get-Date).AddYears(3)
          & (Join-Path $kit 'bin\x86\signtool.exe') sign /fd SHA256 /sha1 $cert.Thumbprint /s My $driver
          if ($LASTEXITCODE -ne 0) { throw 'Kernel probe test signing failed' }
          $output = Join-Path $env:RUNNER_TEMP 'a04-button-artifact'
          New-Item -ItemType Directory -Force $output | Out-Null
          Copy-Item $driver $output
          [ordered]@{ source_commit = (git rev-parse HEAD); sha256 = (Get-FileHash $driver -Algorithm SHA256).Hash; note = 'Experimental test-signed diagnostic; not a production driver.' } | ConvertTo-Json | Set-Content -Encoding UTF8 (Join-Path $output 'manifest.json')
      - name: Upload experimental button probe
        if: ${{ !inputs.ssh_debug }}
        uses: actions/upload-artifact@v4
        with:
          name: a04-button-kernel-probe
          path: ${{ runner.temp }}\a04-button-artifact
          if-no-files-found: error
      - name: Test guarded cleanup with a missing driver file
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: |
          ./tools/ci/build-compare-files.ps1 -Arch x64
          ./tools/ci/test-button-kernel-missing.ps1
      - name: Test button provider staging guards
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/test-button-provider-stage.ps1
      - name: Test button provider removal guards
        if: ${{ !inputs.ssh_debug }}
        shell: pwsh
        run: ./tools/ci/test-button-provider-remove.ps1
      - name: Open restricted SSH for intervention
        id: remote
        if: ${{ always() && inputs.ssh_debug }}
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}

  development:
    if: ${{ inputs.ssh_debug && inputs.dev_ssh_only }}
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Keep one SSH runner through setup and hardware debugging
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
          keep-minutes: ${{ inputs.ssh_keep_minutes }}
          on-ready-script: tools/ci/hold-wdk81-development.ps1
