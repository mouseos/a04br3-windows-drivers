name: ARM32 storage foundation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test offline release failure handling
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Itests/offline-release-shim tests/offline_release_test.c -o "$RUNNER_TEMP/offline-release-test"
          "$RUNNER_TEMP/offline-release-test"
      - name: Check GPT snapshot parser
        run: python3 tests/gpt_snapshot_inspector_test.py
      - name: Check INF device names
        run: python3 tools/ci/check-device-names.py
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y acpica-tools device-tree-compiler ntfs-3g
      - run: make test arm-coff
      - run: make test-ntfs-root
  windows-format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run touch component tests on Windows x64
        shell: pwsh
        run: ./tools/ci/test-touch-windows.ps1
      - name: Check legacy driver name staging guards
        shell: pwsh
        run: ./tools/ci/test-legacy-name-stage.ps1
      - name: Check pre-update service restoration guards
        shell: pwsh
        run: ./tools/ci/test-pre-names-service-restore.ps1
      - name: Build ARM32 COFF and native PE format probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build | Out-Null
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $link = (Get-Command lld-link.exe -ErrorAction Stop).Source
          $readobj = (Get-Command llvm-readobj.exe -ErrorAction Stop).Source
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -c drivers/gpu/mt8167/firmware.c -o build/ge8300-firmware-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -c drivers/gpu/mt8167/gpu_mmu.c -o build/ge8300-mmu-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -Idrivers/gpu/mt8167/compat -Idrivers/gpu/mt8167/fwif -c drivers/gpu/mt8167/firmware_objects.c -o build/ge8300-fw-objects-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -Idrivers/gpu/mt8167/compat -Idrivers/gpu/mt8167/fwif -c drivers/gpu/mt8167/firmware_queue.c -o build/ge8300-fw-queue-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -Idrivers/gpu/mt8167/compat -Idrivers/gpu/mt8167/fwif -c drivers/gpu/mt8167/transfer_stream.c -o build/ge8300-transfer-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -Idrivers/gpu/mt8167/compat -Idrivers/gpu/mt8167/fwif -c drivers/gpu/mt8167/firmware_runtime.c -o build/ge8300-runtime-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -Idrivers/gpu/mt8167/compat -Idrivers/gpu/mt8167/fwif -c drivers/gpu/mt8167/firmware_start.c -o build/ge8300-start-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -Wall -Wextra -Werror -std=c11 -c drivers/storage/mt8167-msdc/cdb.c -o build/cdb-arm.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $clang --target=thumbv7-pc-windows-msvc -ffreestanding -fno-stack-protector -c tests/pe_probe.c -o build/pe-probe.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $link /machine:arm /subsystem:native /driver /entry:DriverEntry /nodefaultlib /out:build/pe-probe.sys build/pe-probe.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $header = & $readobj --file-headers build/pe-probe.sys
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($header -join "`n") -notmatch 'IMAGE_FILE_MACHINE_ARMNT') { throw 'ARM32 PE machine mismatch' }
