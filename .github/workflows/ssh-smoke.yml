name: Windows runner SSH smoke test
on:
  workflow_dispatch:
jobs:
  ssh:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Open restricted SSH for intervention
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
      - name: Keep runner for connection test
        shell: pwsh
        run: |
          $until = (Get-Date).AddMinutes(6)
          $stop = Join-Path $env:GITHUB_WORKSPACE 'end-ssh'
          while ((Get-Date) -lt $until -and -not (Test-Path $stop)) { Start-Sleep -Seconds 5 }
