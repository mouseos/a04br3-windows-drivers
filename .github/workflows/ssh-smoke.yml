name: Windows runner SSH smoke test
on:
  workflow_dispatch:
jobs:
  ssh:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Open restricted SSH for intervention
        uses: ./.github/actions/open-ssh
        with:
          authorized-key: ${{ secrets.A04BR3_RUNNER_SSH_PUBLIC_KEY }}
          keep-minutes: 90
