name: Offline release ARM32 WDK check
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Microsoft SDK and WDK 8.1
        shell: pwsh
        run: ./tools/ci/install-wdk81.ps1
      - name: Compile ARM32 release primitive
        shell: pwsh
        run: ./tools/ci/build-offline-release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: offline-release-arm32-unsigned
          path: ${{ runner.temp }}/a04-offline-release/release-offline-volume.exe
          if-no-files-found: error
