name: Open restricted Windows runner SSH
inputs:
  authorized-key:
    description: Public key for the development machine
    required: true
  keep-minutes:
    description: Minutes to keep the runner available
    required: false
    default: '180'
  background:
    description: Keep the tunnel running for later workflow steps
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Start key-only SSH server
      id: server
      uses: lexbritvin/ssh-server-action@35c4dac5bfee99ffde7c2f8886bcd054a8bdb47e
      with:
        port: '2222'
        authorized-keys: ${{ inputs.authorized-key }}
        use-actor-ssh-keys: 'true'
    - name: Save connection details
      shell: pwsh
      env:
        SERVER_USER: ${{ steps.server.outputs.username }}
        SERVER_HOST_KEYS: ${{ steps.server.outputs.host-keys }}
      run: |
        $data = [ordered]@{jump_host='ssh-j.com'; jump_user="a04br3-$env:GITHUB_RUN_ID"; alias="wdk-$env:GITHUB_RUN_ID"; port=2222; user=$env:SERVER_USER; host_keys=$env:SERVER_HOST_KEYS; run_id=$env:GITHUB_RUN_ID}
        $data | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'a04br3-ssh.json')
    - name: Publish ephemeral connection details
      uses: actions/upload-artifact@v4
      with:
        name: a04br3-ssh-${{ github.run_id }}
        path: ${{ runner.temp }}/a04br3-ssh.json
        retention-days: 1
        if-no-files-found: error
    - name: Keep SSH jump tunnel open
      shell: pwsh
      env:
        SERVER_USER: ${{ steps.server.outputs.username }}
        SERVER_HOST_KEYS: ${{ steps.server.outputs.host-keys }}
        ACTION_PATH: ${{ github.action_path }}
        KEEP_MINUTES: ${{ inputs.keep-minutes }}
        BACKGROUND: ${{ inputs.background }}
      run: |
        $ErrorActionPreference = 'Stop'
        $jumpUser = "a04br3-$env:GITHUB_RUN_ID"
        $alias = "wdk-$env:GITHUB_RUN_ID"
        $known = Join-Path $env:ACTION_PATH 'ssh-j-known-hosts'
        $tunnelLog = Join-Path $env:RUNNER_TEMP 'a04br3-ssh-tunnel.log'
        $args = @('-v','-N','-o','BatchMode=yes','-o','StrictHostKeyChecking=yes','-o',"UserKnownHostsFile=$known",'-o','ExitOnForwardFailure=yes','-o','ServerAliveInterval=20','-R',"${alias}:2222:127.0.0.1:2222","${jumpUser}@ssh-j.com")
        # The runner cleans up processes tagged with the step's tracking ID.
        # A detached tunnel must survive into the installer and build steps.
        $previousTracking = $env:RUNNER_TRACKING_ID
        if ($env:BACKGROUND -eq 'true') { $env:RUNNER_TRACKING_ID = "a04br3-ssh-$env:GITHUB_RUN_ID" }
        try {
          $process = Start-Process -FilePath 'ssh.exe' -ArgumentList $args -RedirectStandardError $tunnelLog -PassThru -NoNewWindow
        } finally {
          $env:RUNNER_TRACKING_ID = $previousTracking
        }
        $ready = $false
        for ($i = 0; $i -lt 40; $i++) {
          Start-Sleep -Milliseconds 500
          if ($process.HasExited) { break }
          if ((Test-Path $tunnelLog) -and ((Get-Content $tunnelLog -Raw) -match 'remote forward success')) { $ready = $true; break }
        }
        if (-not $ready) { if (Test-Path $tunnelLog) { Get-Content $tunnelLog }; throw 'SSH jump tunnel did not start' }
        Write-Host "SSH tunnel ready. Download a04br3-ssh-$env:GITHUB_RUN_ID for connection details."
        if ($env:BACKGROUND -eq 'true') {
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'a04br3-ssh-tunnel.pid') -Value $process.Id
          return
        }
        $until = (Get-Date).AddMinutes([int]$env:KEEP_MINUTES)
        $stop = Join-Path $env:GITHUB_WORKSPACE 'end-ssh'
        while ((Get-Date) -lt $until -and -not (Test-Path $stop)) {
          Start-Sleep -Seconds 5
          $process.Refresh()
          if ($process.HasExited) { Get-Content $tunnelLog; throw 'SSH tunnel exited unexpectedly' }
        }
        Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
